name: Build signed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in MAJOR.MINOR.PATCH form
        required: true
        type: string
      build_number:
        description: Positive integer build number
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Sign and notarize
    runs-on: xcode-27
    environment: production
    timeout-minutes: 45
    env:
      TRACE_CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12
      TRACE_SIGNING_KEYCHAIN: ${{ runner.temp }}/trace-signing.keychain-db
      TRACE_NOTARY_KEY_PATH: ${{ runner.temp }}/notary-api-key.p8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$CERTIFICATE_BASE64" |
            base64 --decode -o "$TRACE_CERTIFICATE_PATH"
          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$TRACE_SIGNING_KEYCHAIN"
          security set-keychain-settings \
            -lut 21600 \
            "$TRACE_SIGNING_KEYCHAIN"
          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$TRACE_SIGNING_KEYCHAIN"
          security import "$TRACE_CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$TRACE_SIGNING_KEYCHAIN"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$TRACE_SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$TRACE_SIGNING_KEYCHAIN"

      - name: Install notarization API key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
        run: |
          printf '%s' "$NOTARY_KEY_BASE64" |
            base64 --decode -o "$TRACE_NOTARY_KEY_PATH"
          chmod 600 "$TRACE_NOTARY_KEY_PATH"

      - name: Build, sign, and notarize
        env:
          TRACE_CODE_SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          TRACE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          TRACE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          ./tools/build-signed-release \
            "${{ inputs.version }}" \
            "${{ inputs.build_number }}"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trace-${{ inputs.version }}-${{ inputs.build_number }}
          path: |
            .build/release/Trace-${{ inputs.version }}-${{ inputs.build_number }}.zip
            .build/release/Trace-${{ inputs.version }}-${{ inputs.build_number }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing credentials
        if: always()
        run: |
          if [[ -f "$TRACE_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$TRACE_SIGNING_KEYCHAIN" || true
          fi
          rm -f "$TRACE_CERTIFICATE_PATH"
          rm -f "$TRACE_NOTARY_KEY_PATH"
